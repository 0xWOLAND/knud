[package]
name = "knud"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
futures-util = "0.3.32"
rustls = { version = "0.23.38", features = ["ring"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
